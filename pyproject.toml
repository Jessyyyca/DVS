[project]
name = "dvs"
version = "0.1.0"
description = "Pokemon DWH importer (Limitless + TickerMint) on asyncpg + aiohttp."
readme = "README.md"
authors = [
    { name = "kurama", email = "paul.zenker.pz@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
dvs = "dvs:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
